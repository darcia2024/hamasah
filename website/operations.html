<!doctype html><html lang="id"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Operasional | Hamasah International</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet" /><link rel="stylesheet" href="website.css?v=18" /><link rel="stylesheet" href="staff.css?v=1" /><link rel="stylesheet" href="portal.css?v=2" /></head><body class="staff-page"><main class="staff-shell"><header class="staff-header"><a href="portal.html" class="staff-brand">Hamasah <span>Operasional</span></a><nav class="staff-nav" id="staff-nav" hidden></nav><a href="portal.html" class="button button--secondary">Portal akun</a></header><section id="operations-guard" class="staff-login"><p class="eyebrow">Operasional</p><h1>Memeriksa akses.</h1><p id="operations-guard-copy">Silakan masuk melalui Portal Hamasah.</p></section><section id="operations-console" hidden><div class="staff-intro"><div><p class="eyebrow">Admin</p><h1>Keuangan, visa, dan inventaris.</h1></div><button id="reload-operations" class="button button--secondary" type="button">Perbarui data</button></div><div class="portal-admin-grid"><form id="invoice-form" class="staff-form"><h2>Buat invoice</h2><label for="invoice-student">Santri</label><select id="invoice-student"></select><label for="invoice-description">Keterangan</label><input id="invoice-description" type="text" placeholder="SPP September 2026" required /><label for="invoice-amount">Nominal Rupiah</label><input id="invoice-amount" type="number" min="1" required /><button class="button button--primary" type="submit">Buat invoice</button><p id="invoice-status" class="form-status"></p></form><form id="visa-form" class="staff-form"><h2>Update visa</h2><label for="visa-student">Santri</label><select id="visa-student"></select><label for="visa-state">Status visa</label><select id="visa-state"><option value="not-started">Belum dimulai</option><option value="collecting-documents">Kumpulkan berkas</option><option value="legalization">Legalisasi</option><option value="submitted">Diajukan</option><option value="approved">Disetujui</option><option value="expired">Kedaluwarsa</option></select><label for="visa-note">Catatan</label><textarea id="visa-note" rows="3"></textarea><button class="button button--primary" type="submit">Simpan status visa</button><p id="visa-status" class="form-status"></p></form></div><form id="inventory-form" class="staff-form record-form"><h2>Inventaris asrama</h2><label for="inventory-name">Nama barang</label><input id="inventory-name" type="text" required /><label for="inventory-location">Lokasi</label><input id="inventory-location" type="text" placeholder="Hay Asyir" required /><label for="inventory-quantity">Jumlah</label><input id="inventory-quantity" type="number" min="0" required /><button class="button button--secondary" type="submit">Simpan inventaris</button><p id="inventory-status" class="form-status"></p></form><section class="portal-admin"><div><p class="eyebrow">Ringkasan</p><h2>Data operasional terbaru.</h2></div><div id="operations-list" class="portal-account-list"></div></section></section></main><script src="nav.js?v=1"></script><script src="operations.js?v=1"></script></body></html>
