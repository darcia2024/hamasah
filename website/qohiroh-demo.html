<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Demo sistem untuk Qohiroh Center: satu santri diikuti dari pendaftaran sampai walinya menerima kuitansi, dengan layar tiap peran." />
    <title>Demo sistem Qohiroh Center</title>
    <link rel="icon" href="../assets/qohiroh/logo-mark.png" />
    <link rel="preload" href="../assets/fonts/qohiroh/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../assets/fonts/qohiroh/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="qohiroh-demo.css?v=56223d7643" />
  </head>
  <body>
    <div class="demo" id="demo">
      <header class="demo__atas">
        <a class="demo__merek" href="qohiroh.html" aria-label="Kembali ke penawaran Qohiroh Center"><img src="../assets/qohiroh/logo-emblem.png" alt="" width="60" height="34" /><span>Qohiroh Center</span></a>
        <p class="demo__judul">Satu santri, dari pendaftaran sampai kuitansi</p>
        <div class="demo__alat">
          <a class="alat" id="alat-mode" href="?ringkas=1#1" title="Hanya 5 langkah utama">Versi ringkas</a>
          <button type="button" class="alat" id="alat-catatan" aria-pressed="false" title="Tampilkan catatan pembicara (N)">Catatan</button>
          <button type="button" class="alat" id="alat-penuh" title="Layar penuh (F)">Layar penuh</button>
        </div>
      </header>

      <div class="demo__bar" aria-hidden="true"><span id="bar"></span></div>

      <main class="demo__isi" id="isi">
        <section class="adegan" aria-labelledby="adegan-judul">
          <p class="adegan__peran"><span id="adegan-no">1</span><strong id="adegan-peran">Petugas pendaftaran</strong></p>
          <h1 id="adegan-judul">Memuat demo</h1>
          <p class="adegan__lihat" id="adegan-lihat"></p>
          <ul class="adegan__poin" id="adegan-poin"></ul>
          <aside class="catatan" id="catatan" hidden aria-label="Catatan pembicara">
            <strong>Catatan pembicara</strong>
            <p id="catatan-teks"></p>
          </aside>
        </section>
        <div class="layar" id="layar" aria-live="polite"></div>
      </main>

      <footer class="demo__bawah">
        <button type="button" class="nav-btn" id="mundur">Sebelumnya</button>
        <ol class="titik" id="titik" aria-label="Langkah demo"></ol>
        <button type="button" class="nav-btn nav-btn--maju" id="maju">Berikutnya</button>
      </footer>
      <p class="petunjuk">Panah kiri dan kanan untuk pindah langkah. Data di semua gambar adalah contoh, bukan data lembaga.</p>
    </div>

    <noscript>
      <p class="tanpa-js">Demo ini butuh JavaScript. Semua layar yang sama bisa dilihat di <a href="qohiroh.html#tampilan">halaman penawaran</a>.</p>
    </noscript>

    <script src="qohiroh-demo.js?v=c68ed4bd75"></script>
  </body>
</html>
