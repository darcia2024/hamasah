<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lupa kata sandi | Hamasah International</title>
  <link rel="stylesheet" href="auth-pages.css">
</head>
<body data-forgot-password>
  <main>
    <p class="eyebrow">Hamasah International</p>
    <h1>Lupa kata sandi</h1>
    <p>Masukkan email akun Anda. Jika tersedia, tautan reset akan dikirim melalui kanal resmi.</p>
    <form id="forgot-password-form">
      <label for="forgot-email">Email akun <input id="forgot-email" name="email" type="email" autocomplete="email" required aria-describedby="forgot-email-error"><span class="field-error" id="forgot-email-error"></span></label>
      <button type="submit" data-label="Kirim instruksi">Kirim instruksi</button>
    </form>
    <p class="status" data-status aria-live="polite"></p>
    <p><a href="portal.html">Kembali ke halaman masuk</a></p>
  </main>
  <script src="auth-pages.js" defer></script>
</body>
</html>
