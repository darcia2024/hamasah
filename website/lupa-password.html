<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lupa kata sandi | Hamasah International</title>
  <link rel="stylesheet" href="auth-pages.css">
</head>
<body>
  <main>
    <p class="eyebrow">Hamasah International</p>
    <h1>Lupa kata sandi</h1>
    <p>Masukkan email akun Anda. Jika tersedia, instruksi reset akan dikirim melalui kanal resmi.</p>
    <form id="forgot-password-form">
      <label>Email <input name="email" type="email" autocomplete="email" required></label>
      <button type="submit" data-label="Kirim instruksi">Kirim instruksi</button>
    </form>
    <p class="status" data-status aria-live="polite"></p>
    <p><a href="portal.html">Kembali ke halaman masuk</a></p>
  </main>
  <script src="auth-pages.js"></script>
  <script>
    const form = document.querySelector('#forgot-password-form');
    const status = document.querySelector('[data-status]');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      setSubmitting(form, true); setStatus(status, '');
      try {
        const data = await requestJson('/api/auth/password-reset-request', { email: form.elements.email.value });
        form.reset(); setStatus(status, data.message, 'success');
      } catch (error) { setStatus(status, error.message, 'error'); }
      finally { setSubmitting(form, false); }
    });
  </script>
</body>
</html>
