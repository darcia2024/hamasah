<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>Aktivasi akun | Hamasah International</title>
    <link rel="icon" href="../assets/favicon.png" />
  <link rel="stylesheet" href="auth-pages.css?v=fac8b7ad25">
</head>
<body data-password-endpoint="/api/auth/invitations/accept" data-password-success="Akun aktif. Silakan masuk ke portal dengan kata sandi baru Anda." data-password-redirect="portal.html?activated=1">
  <main>
    <p class="eyebrow">Hamasah International</p>
    <h1>Aktivasi akun</h1>
    <p>Buat kata sandi untuk mengaktifkan akun Anda. Gunakan minimal 12 karakter.</p>
    <div class="token-state" data-token-state="loading" role="status" aria-live="polite">
      <strong data-token-state-title>Memeriksa tautan aktivasi…</strong>
      <span data-token-state-message>Jangan tutup halaman ini.</span>
      <a class="token-recovery-link" href="lupa-password.html">Minta tautan baru</a>
    </div>
    <form data-password-form novalidate hidden>
      <div class="password-control"><label for="activation-password">Kata sandi baru</label><span class="password-field"><input id="activation-password" name="password" type="password" autocomplete="new-password" required minlength="12"><button type="button" class="password-toggle" data-password-toggle="activation-password" aria-label="Tampilkan kata sandi">Tampilkan</button></span></div>
      <div class="password-control"><label for="activation-confirmation">Ulangi kata sandi</label><span class="password-field"><input id="activation-confirmation" name="confirmation" type="password" autocomplete="new-password" required minlength="12"><button type="button" class="password-toggle" data-password-toggle="activation-confirmation" aria-label="Tampilkan kata sandi">Tampilkan</button></span></div>
      <button type="submit" data-label="Aktifkan akun">Aktifkan akun</button>
    </form>
    <p class="status" data-status aria-live="polite"></p>
    <p><a href="portal.html">Kembali ke halaman masuk</a></p>
  </main>
  <script src="auth-pages.js?v=67cf604fac" defer></script>
</body>
</html>
