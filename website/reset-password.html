<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>Atur ulang kata sandi | Hamasah International</title>
    <link rel="icon" href="../assets/favicon.png" />
  <link rel="stylesheet" href="auth-pages.css?v=64aee59960">
</head>
<body data-password-endpoint="/api/auth/password-reset" data-password-success="Kata sandi sudah diperbarui. Silakan masuk kembali.">
  <main>
    <p class="eyebrow">Hamasah International</p>
    <h1>Atur ulang kata sandi</h1>
    <p>Buat kata sandi baru untuk akun Anda. Gunakan minimal 12 karakter.</p>
    <div class="token-state" data-token-state="loading" role="status" aria-live="polite">
      <strong data-token-state-title>Memeriksa tautan reset…</strong>
      <span data-token-state-message>Jangan tutup halaman ini.</span>
      <a class="token-recovery-link" href="lupa-password.html">Minta tautan baru</a>
    </div>
    <form data-password-form novalidate hidden>
      <div class="password-control"><label for="reset-password">Kata sandi baru</label><span class="password-field"><input id="reset-password" name="password" type="password" autocomplete="new-password" required minlength="12"><button type="button" class="password-toggle" data-password-toggle="reset-password" aria-label="Tampilkan kata sandi">Tampilkan</button></span></div>
      <div class="password-control"><label for="reset-confirmation">Ulangi kata sandi</label><span class="password-field"><input id="reset-confirmation" name="confirmation" type="password" autocomplete="new-password" required minlength="12"><button type="button" class="password-toggle" data-password-toggle="reset-confirmation" aria-label="Tampilkan kata sandi">Tampilkan</button></span></div>
      <button type="submit" data-label="Simpan kata sandi">Simpan kata sandi</button>
    </form>
    <p class="status" data-status aria-live="polite"></p>
    <p><a href="portal.html">Kembali ke halaman masuk</a></p>
  </main>
  <script src="auth-pages.js?v=67cf604fac" defer></script>
</body>
</html>
